name: Refresh Sleeper players

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-snapshot-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh compact player snapshot
        run: node scripts/refresh-sleeper-players.mjs
      - name: Validate compact player snapshot
        run: node scripts/refresh-sleeper-players.mjs --check
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/sleeper/players.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sleeper/players.json
          git commit -m "chore: refresh Sleeper player snapshot"
          git push
