name: Refresh projections
on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * 7,8 *"
    - cron: "47 9 * 1-6,9-12 1"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: repository-snapshot-refresh-${{ github.repository }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/refresh-projections.mjs
      - run: node scripts/refresh-projections.mjs --check
      - name: Open a pull request for a changed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/projections/last-known.json; then
            echo "Projection snapshot is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/projections-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projections/last-known.json
          git commit -m "chore: refresh projection snapshot"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore: refresh projection snapshot" \
            --body "Automated projection snapshot refresh. Review unexpected source or schema changes before merging.")"
          echo "Opened snapshot pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
